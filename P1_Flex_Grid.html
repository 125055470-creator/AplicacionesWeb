<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor {
            /*display: flex;
            flex-direction: column;*/
            display: grid;
            grid-template-columns: repeat(3, 1fr);

        }
        .card {
            width: 80px;
            padding: 20px;
            margin: 10px;
        } 
        .card-larga {
            grid-column: 3;
            grid-row: span 3;
    

            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color:rgb(78, 78, 227)">CARD 1</div>
        <div class="card" style="background-color: cadetblue;">CARD 2</div>
        <div class="card-larga" style="background-color: cornflowerblue;">CARD 3</div>
        <div class="card" style="background-color: rgb(99, 105, 146);">CARD 4</div>
        <div class="card" style="background-color: aquamarine;">CARD 5</div>
        <div class="card" style="background-color:darkcyan;">CARD 6</div>
        <div class="card" style="background-color:rgb(135, 184, 229) ;">CARD 7</div>
    </div>
</body>
</html>
